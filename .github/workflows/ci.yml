name: CI

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate monorepo structure
        run: make check
      - name: Test evaluation runner
        run: make evaluation-test
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --requirement requirements.txt
      - name: Install isolated MCP client dependencies
        run: |
          python -m venv mcp-server/.venv
          mcp-server/.venv/bin/python -m pip install --requirement mcp-server/requirements.txt
      - name: Run backend tests including real MCP Agent calls and replay
        working-directory: backend
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: agentdesk-ci-${{ github.run_id }}-${{ github.run_attempt }}
      EVALUATION_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml config --quiet
      - name: Start and seed Mock demo
        run: make demo
      - name: Validate Nginx and published endpoints
        run: |
          docker compose exec -T frontend nginx -t
          curl --fail --silent http://127.0.0.1:5173/healthz
          curl --fail --silent http://127.0.0.1:5173/health
          curl --fail --silent http://127.0.0.1:8000/health
      - name: Check workbench, Mock tasks, snapshots, and replay
        run: make demo-check
      - name: Evaluate deterministic Runtime V4 cases
        run: make evaluate
      - name: Check MCP order tasks, permissions, traces, failures, and replay
        run: make mcp-runtime-check
      - name: Check MCP tracking tasks, permissions, errors, snapshots, and replay
        run: make mcp-tracking-check
      - name: Check MCP ticket writes, deduplication, permissions, and replay
        run: make mcp-ticket-check
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-evaluation-report
          path: evaluation/reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Recreate services and verify persisted data
        run: |
          make stop
          make demo
          docker compose -f docker-compose.yml -f docker-compose.mock.yml exec -T backend \
            python -m app.check_demo --base-url http://frontend --verify-persistence
          docker compose -f docker-compose.yml -f docker-compose.mock.yml exec -T backend \
            python -m app.check_mcp_ticket --base-url http://frontend --verify-persistence
      - name: Show container logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Clean up CI containers and volumes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml down --volumes --remove-orphans

  mcp-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: agentdesk-mcp-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate MCP profile
        run: docker compose --profile mcp config --quiet
      - name: Test business data plus MCP protocol behavior
        run: make mcp-test
      - name: Check the standalone stdio business tools
        run: make mcp-check
      - name: Clean up MCP CI containers
        if: always()
        run: docker compose --profile mcp down --remove-orphans
