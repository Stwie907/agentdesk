name: CI

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate monorepo structure
        run: make check
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --requirement requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: agentdesk-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml config --quiet
      - name: Start and seed Mock demo
        run: make demo
      - name: Validate Nginx and published endpoints
        run: |
          docker compose exec -T frontend nginx -t
          curl --fail --silent http://127.0.0.1:5173/healthz
          curl --fail --silent http://127.0.0.1:5173/health
          curl --fail --silent http://127.0.0.1:8000/health
      - name: Check workbench, Mock tasks, snapshots, and replay
        run: make demo-check
      - name: Recreate services and verify persisted data
        run: |
          make stop
          make demo
          docker compose -f docker-compose.yml -f docker-compose.mock.yml exec -T backend \
            python -m app.check_demo --base-url http://frontend --verify-persistence
      - name: Show container logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Clean up CI containers and volumes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml down --volumes --remove-orphans
